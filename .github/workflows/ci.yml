name: CI main disk measurements for PR 1669
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DATABASE_URL: postgresql://adcp_user:test_password@127.0.0.1:5432/adcp_test
  GEMINI_API_KEY: test_key_for_mocking
  GOOGLE_CLIENT_ID: test_client_id
  GOOGLE_CLIENT_SECRET: test_client_secret
  SUPER_ADMIN_EMAILS: test@example.com
  ADCP_TESTING: true
  ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
jobs:
  integration-tests:
    name: Integration (${{ matrix.group }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
        - group: creative
          marker: creative
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adcp_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: adcp_test
        options: --health-cmd "pg_isready -U adcp_user" --health-interval 5s --health-timeout 3s --health-retries
          10
        ports:
        - 5432:5432
    steps:
    - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40
      with:
        egress-policy: audit
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: ./.github/actions/_setup-env
    - uses: ./.github/actions/_postgres
      if: matrix.group != 'creative'
      with:
        database-url: ${{ env.DATABASE_URL }}
    - name: Log in to GitHub Container Registry
      if: matrix.group == 'creative'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Start measuring disk use before the gate
      shell: bash
      run: |
        set -euo pipefail
        df -h /
        printf '%s\t%s\n' "$(date -u +%FT%TZ)" "$(df -B1 --output=avail / | tail -1)" > "$RUNNER_TEMP/disk-samples.tsv"
        cat > "$RUNNER_TEMP/disk-sampler.sh" <<'SAMPLE'
        set -euo pipefail
        while true; do
          printf '%s\t%s\n' "$(date -u +%FT%TZ)" "$(df -B1 --output=avail / | tail -1)" >> "$RUNNER_TEMP/disk-samples.tsv"
          sleep 1
        done
        SAMPLE
        nohup bash "$RUNNER_TEMP/disk-sampler.sh" > "$RUNNER_TEMP/disk-sampler.log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/disk-sampler.pid"
    - uses: ./.github/actions/_pytest
      if: matrix.group != 'creative'
      with:
        paths: tests/integration/
        disable_randomly: 'true'
        extra_args: --timeout=60 -m "(${{ matrix.marker }}) and not skip_ci"
    - name: Run integration suite in-network
      if: matrix.group == 'creative'
      timeout-minutes: 60
      run: |
        sudo fallocate -l 8G /ci-swapfile && sudo chmod 600 /ci-swapfile
        sudo mkswap /ci-swapfile && sudo swapon /ci-swapfile
        ./run_all_tests.sh integration
      env:
        DOCKER_BUILDKIT: 1
        COMPOSE_DOCKER_CLI_BUILD: 1
        CREATIVE_AGENT_GHCR_IMAGE: ''
        RUN_ALL_SKIP_AUDIT: 1
        INTEGRATION_XDIST_N: 3
    - name: Report peak disk use
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        sampler="$(cat "$RUNNER_TEMP/disk-sampler.pid")"
        kill -0 "$sampler"
        kill "$sampler"
        test ! -s "$RUNNER_TEMP/disk-sampler.log"
        awk 'NR == 1 {start=$2; min=$2; at=$1} $2 < min {min=$2; at=$1} END {printf "DISK_PEAK start_bytes=%.0f minimum_free_bytes=%.0f consumed_bytes=%.0f at=%s samples=%d\n", start, min, start-min, at, NR}' "$RUNNER_TEMP/disk-samples.tsv" | tee -a "$GITHUB_STEP_SUMMARY"
        df -h /
    - name: Upload raw disk samples
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: disk-integration-tests
        path: ${{ runner.temp }}/disk-samples.tsv
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: failure() && matrix.group == 'creative'
      with:
        name: integration-in-network-results
        path: test-results/innet_*/
        if-no-files-found: warn
    - name: Cleanup Docker services
      if: always() && matrix.group == 'creative'
      run: docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25
    steps:
    - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40
      with:
        egress-policy: audit
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: ./.github/actions/_setup-env
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Start measuring disk use before the gate
      shell: bash
      run: |
        set -euo pipefail
        df -h /
        printf '%s\t%s\n' "$(date -u +%FT%TZ)" "$(df -B1 --output=avail / | tail -1)" > "$RUNNER_TEMP/disk-samples.tsv"
        cat > "$RUNNER_TEMP/disk-sampler.sh" <<'SAMPLE'
        set -euo pipefail
        while true; do
          printf '%s\t%s\n' "$(date -u +%FT%TZ)" "$(df -B1 --output=avail / | tail -1)" >> "$RUNNER_TEMP/disk-samples.tsv"
          sleep 1
        done
        SAMPLE
        nohup bash "$RUNNER_TEMP/disk-sampler.sh" > "$RUNNER_TEMP/disk-sampler.log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/disk-sampler.pid"
    - name: Ensure docker-compose alias exists
      run: |
        docker compose version
        echo '#!/bin/bash' | sudo tee /usr/local/bin/docker-compose
        echo 'exec docker compose "$@"' | sudo tee -a /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
    - name: Clean up lingering containers
      run: |
        docker ps -q | xargs -r docker kill || true
        docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
        docker compose down -v 2>/dev/null || true
        docker container prune -f 2>/dev/null || true
        docker network prune -f 2>/dev/null || true
        docker volume prune -f 2>/dev/null || true
    - name: Run E2E suite in-network
      run: ./run_all_tests.sh e2e
      env:
        DOCKER_BUILDKIT: 1
        COMPOSE_DOCKER_CLI_BUILD: 1
        CREATIVE_AGENT_GHCR_IMAGE: ''
        RUN_ALL_SKIP_AUDIT: 1
    - name: Report peak disk use
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        sampler="$(cat "$RUNNER_TEMP/disk-sampler.pid")"
        kill -0 "$sampler"
        kill "$sampler"
        test ! -s "$RUNNER_TEMP/disk-sampler.log"
        awk 'NR == 1 {start=$2; min=$2; at=$1} $2 < min {min=$2; at=$1} END {printf "DISK_PEAK start_bytes=%.0f minimum_free_bytes=%.0f consumed_bytes=%.0f at=%s samples=%d\n", start, min, start-min, at, NR}' "$RUNNER_TEMP/disk-samples.tsv" | tee -a "$GITHUB_STEP_SUMMARY"
        df -h /
    - name: Upload raw disk samples
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: disk-e2e-tests
        path: ${{ runner.temp }}/disk-samples.tsv
        if-no-files-found: error
    - name: Cleanup Docker services
      if: always()
      run: docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
  bdd-in-network:
    name: BDD In-Network (e2e_rest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 75
    steps:
    - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40
      with:
        egress-policy: audit
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Clean up lingering containers
      run: |
        docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
        docker container prune -f 2>/dev/null || true
        docker network prune -f 2>/dev/null || true
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Start measuring disk use before the gate
      shell: bash
      run: |
        set -euo pipefail
        df -h /
        printf '%s\t%s\n' "$(date -u +%FT%TZ)" "$(df -B1 --output=avail / | tail -1)" > "$RUNNER_TEMP/disk-samples.tsv"
        cat > "$RUNNER_TEMP/disk-sampler.sh" <<'SAMPLE'
        set -euo pipefail
        while true; do
          printf '%s\t%s\n' "$(date -u +%FT%TZ)" "$(df -B1 --output=avail / | tail -1)" >> "$RUNNER_TEMP/disk-samples.tsv"
          sleep 1
        done
        SAMPLE
        nohup bash "$RUNNER_TEMP/disk-sampler.sh" > "$RUNNER_TEMP/disk-sampler.log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/disk-sampler.pid"
    - name: Run BDD suite in-network
      run: ./run_all_tests.sh bdd_e2e
      env:
        DOCKER_BUILDKIT: 1
        COMPOSE_DOCKER_CLI_BUILD: 1
        CREATIVE_AGENT_GHCR_IMAGE: ''
        RUN_ALL_SKIP_AUDIT: 1
    - name: Report peak disk use
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        sampler="$(cat "$RUNNER_TEMP/disk-sampler.pid")"
        kill -0 "$sampler"
        kill "$sampler"
        test ! -s "$RUNNER_TEMP/disk-sampler.log"
        awk 'NR == 1 {start=$2; min=$2; at=$1} $2 < min {min=$2; at=$1} END {printf "DISK_PEAK start_bytes=%.0f minimum_free_bytes=%.0f consumed_bytes=%.0f at=%s samples=%d\n", start, min, start-min, at, NR}' "$RUNNER_TEMP/disk-samples.tsv" | tee -a "$GITHUB_STEP_SUMMARY"
        df -h /
    - name: Upload raw disk samples
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: disk-bdd-in-network
        path: ${{ runner.temp }}/disk-samples.tsv
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: failure()
      with:
        name: bdd-in-network-results
        path: test-results/innet_*/
        if-no-files-found: warn
    - name: Cleanup Docker services
      if: always()
      run: docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
  storyboard-conformance:
    name: Storyboard Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
    - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40
      with:
        egress-policy: audit
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Clean up lingering containers
      run: |
        docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
        docker container prune -f 2>/dev/null || true
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Start measuring disk use before the gate
      shell: bash
      run: |
        set -euo pipefail
        df -h /
        printf '%s\t%s\n' "$(date -u +%FT%TZ)" "$(df -B1 --output=avail / | tail -1)" > "$RUNNER_TEMP/disk-samples.tsv"
        cat > "$RUNNER_TEMP/disk-sampler.sh" <<'SAMPLE'
        set -euo pipefail
        while true; do
          printf '%s\t%s\n' "$(date -u +%FT%TZ)" "$(df -B1 --output=avail / | tail -1)" >> "$RUNNER_TEMP/disk-samples.tsv"
          sleep 1
        done
        SAMPLE
        nohup bash "$RUNNER_TEMP/disk-sampler.sh" > "$RUNNER_TEMP/disk-sampler.log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/disk-sampler.pid"
    - uses: ./.github/actions/_setup-env
    - id: bundle
      uses: ./.github/actions/_adcp-bundle
    - name: Run storyboard conformance in-network
      run: ./run_all_tests.sh storyboard
      env:
        DOCKER_BUILDKIT: 1
        COMPOSE_DOCKER_CLI_BUILD: 1
        CREATIVE_AGENT_GHCR_IMAGE: ''
        RUN_ALL_SKIP_AUDIT: 1
    - name: Report peak disk use
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        sampler="$(cat "$RUNNER_TEMP/disk-sampler.pid")"
        kill -0 "$sampler"
        kill "$sampler"
        test ! -s "$RUNNER_TEMP/disk-sampler.log"
        awk 'NR == 1 {start=$2; min=$2; at=$1} $2 < min {min=$2; at=$1} END {printf "DISK_PEAK start_bytes=%.0f minimum_free_bytes=%.0f consumed_bytes=%.0f at=%s samples=%d\n", start, min, start-min, at, NR}' "$RUNNER_TEMP/disk-samples.tsv" | tee -a "$GITHUB_STEP_SUMMARY"
        df -h /
    - name: Upload raw disk samples
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: disk-storyboard-conformance
        path: ${{ runner.temp }}/disk-samples.tsv
        if-no-files-found: error
    - name: Publish the storyboard runner score
      if: always()
      run: |
        set -o pipefail
        uv run python scripts/audit/storyboard_runner_score.py --repo . --markdown | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Publish storyboard reports to the job summary
      if: always()
      env:
        ADCP_BUNDLE: ${{ steps.bundle.outputs.bundle-dir }}
      run: "set -uo pipefail\nemit() {  # $1 = generator stem, $2 = human title\n  printf '\\n<details>\\n<summary><b>%s</b></summary>\\\
        n\\n' \"$2\" >> \"$GITHUB_STEP_SUMMARY\"\n  if uv run python \"scripts/audit/$1.py\" --repo . --adcp \"\
        $ADCP_BUNDLE\" --markdown \\\n       >> \"$GITHUB_STEP_SUMMARY\" 2>/tmp/\"$1\".err; then\n    :\n  else\n\
        \    {\n      printf '\\n> generator FAILED \u2014 stderr below\\n\\n```\\n'\n      tail -40 /tmp/\"$1\"\
        .err\n      printf '\\n```\\n'\n    } >> \"$GITHUB_STEP_SUMMARY\"\n  fi\n  printf '\\n</details>\\n' >>\
        \ \"$GITHUB_STEP_SUMMARY\"\n}\nemit storyboard_coverage_map \"Storyboard coverage map\"\nemit storyboard_roadmap\
        \      \"Storyboard roadmap\"\nemit storyboard_check_index  \"Storyboard check index (one row per graded\
        \ check)\"\n# GitHub caps a job summary at 1 MiB and silently truncates past it.\n# The three total ~562\
        \ KB today; say so out loud if that changes.\nsize=$(wc -c < \"$GITHUB_STEP_SUMMARY\")\necho \"job summary:\
        \ ${size} bytes (GitHub cap: 1048576)\"\nif [ \"$size\" -gt 1000000 ]; then\n  echo \"::warning::storyboard\
        \ job summary is ${size} bytes, near GitHub's 1 MiB cap \u2014 it will truncate\"\nfi\n"
    - name: Cleanup Docker services
      if: always()
      run: docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
'on':
  workflow_dispatch: null
