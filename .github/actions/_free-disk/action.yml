name: Free disk space
description: >-
  Ensure ubuntu-latest headroom before heavy Docker/compose builds.
  Reclaim unused toolchains and Docker builder cache only below the disk floor.
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        # -x traces the reclaim. pipefail matches the other shell bodies under .github/.
        set -euo pipefail
        set -x
        # Peak additional use: 20.76 GiB (storyboard, 1s df samples during the run).
        # https://github.com/numarasSigmaSoftware/prebid_salesagent/actions/runs/42872300101/job/130026431778
        # 25% headroom, rounded up to the next GiB: ceil(20.76 * 1.25) = 26.
        min_gib=26
        min=$((min_gib * 1024 * 1024 * 1024))
        avail() { df -B1 --output=avail / | tail -1; }
        before="$(avail)"
        if (( before >= min )); then
          echo "free space ${before} bytes meets floor ${min}; skipping reclaim"
          exit 0
        fi
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost \
          /usr/share/swift \
          || true
        docker builder prune -af 2>/dev/null || true
        after="$(avail)"
        # Gate on space left, not bytes deleted: fail below the floor even
        # when cleanup recovered substantial space.
        echo "free ${before} -> ${after} bytes, floor ${min}" >&2
        if (( after < min )); then
          echo "free space ${after} bytes, below ${min}" >&2
          exit 1
        fi
